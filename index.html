<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Electra WiFi</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: #f4f6f8;
        color: #222;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        box-sizing: border-box;
      }
      .card {
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        padding: 2rem 1.75rem;
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      h1 {
        margin: 0 0 1.25rem;
        font-size: 1.5rem;
        font-weight: 600;
      }
      .status {
        margin: 0 0 1.25rem;
        font-size: 1rem;
        line-height: 1.4;
        min-height: 2.8em;
      }
      .status.checking {
        color: #555;
      }
      .status.available {
        color: #0a7f2e;
      }
      .status.unavailable {
        color: #b03a2e;
      }
      .spinner {
        display: inline-block;
        width: 1em;
        height: 1em;
        border: 2px solid #ccc;
        border-top-color: #0066cc;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: -2px;
        margin-right: 0.4em;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      button {
        appearance: none;
        -webkit-appearance: none;
        border: none;
        background: #0066cc;
        color: #fff;
        font-size: 1rem;
        font-weight: 500;
        padding: 0.85rem 1.5rem;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        transition: background 0.15s ease;
      }
      button:hover {
        background: #0052a3;
      }
      button:active {
        background: #004280;
      }
      button:disabled {
        background: #aaa;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Electra WiFi</h1>
      <div id="status" class="status checking">
        <span class="spinner"></span>Checking connection&hellip;
      </div>
      <div id="action"></div>
    </div>

    <script>
      var ELECTRA_LOCAL = "http://electra.local:4000/";
      var TIMEOUT_MS = 5000;

      function setStatus(text, cls) {
        var el = document.getElementById("status");
        el.className = "status " + cls;
        el.innerHTML = text;
      }

      function setAction(html) {
        document.getElementById("action").innerHTML = html;
      }

      function check() {
        setStatus(
          '<span class="spinner"></span>Checking connection&hellip;',
          "checking",
        );
        setAction("");

        var done = false;
        var img = new Image();
        var timer = setTimeout(function () {
          finish(false);
        }, TIMEOUT_MS);

        function finish(ok) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          img.onload = img.onerror = null;
          if (ok) {
            setStatus("Connected to Electra.", "available");
            setAction('<button onclick="go()">Go to electra.local</button>');
          } else {
            setStatus(
              "Can't reach Electra. Make sure you're connected to the Electra WiFi network.",
              "unavailable",
            );
            setAction('<button onclick="check()">Check again</button>');
          }
        }

        img.onload = function () {
          finish(true);
        };
        img.onerror = function () {
          finish(false);
        };
        img.src = ELECTRA_LOCAL + "favicon.ico?_=" + Date.now();
      }

      function go() {
        window.location.href = ELECTRA_LOCAL;
      }

      check();
    </script>
  </body>
</html>
